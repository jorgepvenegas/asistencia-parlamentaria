# ops/config.yaml — edit these to adjust your system
# See ops/derivation.md for WHY each choice was made

dimensions:
  granularity: atomic
  organization: flat
  linking: explicit+implicit
  processing: moderate
  navigation: 3-tier
  maintenance: condition-based
  schema: moderate
  automation: full

features:
  semantic-search: false
  processing-pipeline: true
  sleep-processing: false
  voice-capture: false

processing_tier: auto    # auto | 1 | 2 | 3 | 4

processing:
  depth: standard          # deep | standard | quick
  chaining: suggested      # manual | suggested | automatic
  extraction:
    selectivity: moderate  # strict | moderate | permissive
    categories:
      - architectural decisions
      - component structure
      - data flow patterns
      - change records
      - dependencies and constraints
      - gotchas and patterns
  verification:
    description_test: true
    schema_check: true
    link_check: true
  reweave:
    scope: related         # related | broad | full
    frequency: after_create

provenance: minimal        # full | minimal | off

personality:
  enabled: false

self_evolution:
  observation_threshold: 10
  tension_threshold: 5

research:
  primary: web-search
  fallback: web-search
  last_resort: web-search
  default_depth: moderate

pipeline:
  processing_mode: interactive   # interactive | orchestrated | compressed
  chaining: suggested
